<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SRE Portal</title>
  </head>
  <body>
    <div id="app">
      <style>
        .app-loading {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
        }
        .app-loading .loading-dot {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background-color: #409eff;
          animation: loading-bounce 1.4s infinite ease-in-out both;
        }
        .app-loading .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .app-loading .loading-dot:nth-child(2) { animation-delay: -0.16s; }
        .app-loading .loading-dot:nth-child(3) { animation-delay: 0s; }
        @keyframes loading-bounce {
          0%, 80%, 100% { transform: scale(0); }
          40% { transform: scale(1); }
        }
      </style>
      <div class="app-loading">
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
